PhoneStore.Web/
│
├── Controllers/                  # Chứa các Controller xử lý luồng giao diện (HomeController, ProductController, CartController, AdminController)
│
├── Models/                       # Chứa Entity CSDL (Product, Category, Order, OrderDetail, User) và ApplicationDbContext
│
├── Views/                        # Giao diện HTML (Razor): Chia theo thư mục tương ứng (Home, Product, Cart, Admin...)
│
├── Middlewares/                  # Chứa ExceptionHandlingMiddleware (Bắt lỗi toàn cục)
│
├── wwwroot/                      # Thứa file tĩnh: CSS, JavaScript, Hình ảnh upload và Template Admin (AdminLTE)
│
├── appsettings.json              # Cấu hình chuỗi kết nối Database SQL Server
│
└── Program.exe / Program.cs      # File khởi chạy hệ thống siêu gọn
